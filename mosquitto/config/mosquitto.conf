# Mosquitto configuration for home-historian

# TCP listener (modules, ingester)
listener 1883
socket_domain ipv4

# WebSocket listener (browser-based MQTT clients)
listener 9001
protocol websockets
socket_domain ipv4

# Anonymous connections are allowed because the ports are only published
# locally by default (BIND_ADDRESS in .env). Before opening the broker to the
# LAN, set up a user and password (allow_anonymous false + password_file) and
# put MQTT_USERNAME / MQTT_PASSWORD into .env.
allow_anonymous true

# Plugin: attaches an MQTT 5 user property "timestamp" (ISO 8601, time of
# receipt) to every message. Compiled into the image, see mosquitto/Dockerfile.
# Without it the ingester writes nothing.
plugin /mosquitto/plugins/mosquitto_message_timestamp.so

# ---------------------------------------------------------------------
# Buffer for the ingester
#   The broker keeps messages for the ingester's persistent session while the
#   database, the link to it or the ingester itself is down. How long is set
#   by the ingester's session expiry (INGEST_MQTT_SESSION_EXPIRY_SECONDS).
# ---------------------------------------------------------------------
# The default would be 1000 per client - less than an hour at ~35,000
# messages a day. The limit is a COUNT: max_queued_bytes only counts payload
# bytes, which is no use as a memory cap with payloads this small. A queued
# message takes roughly 480 bytes of RAM; lower this on a machine with little
# memory.
max_queued_messages 1000000

# open3e publishes at QoS 0. Without this line the broker only buffers
# QoS 1/2 for a disconnected client, and the open3e values would be gone.
queue_qos0_messages true

# Do NOT remove while queue_qos0_messages is on: Mosquitto (checked: 2.0.22,
# src/database.c, db__message_dequeue_first) takes one slot from the client's
# inflight quota for EVERY message delivered from the queue, but never gives
# it back for QoS 0. After an outage with more queued QoS 0 messages than the
# quota (default 20), all QoS 1 messages stay stuck until the client
# reconnects. 0 = no quota.
max_inflight_messages 0

# Forgotten MQTT 3 clients with a persistent session must not hoard messages
# forever (MQTT 5 clients bring their own session expiry).
persistent_client_expiration 7d

# ---------------------------------------------------------------------
# Persistence: write to disk rarely
#   The queue lives in RAM and is written to mosquitto.db as a whole only
#   every autosave_interval seconds (a few hundred bytes in normal operation)
#   and on a clean shutdown. A power cut loses at most what was queued since
#   the last autosave. "persistence false" would mean no writes at all, but
#   then every broker restart empties the buffer.
# ---------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800

# ---------------------------------------------------------------------
# Logging: stdout only (Docker limits the size, see compose.yml).
#   No "log_type all": it logs every PINGREQ and every PUBLISH and so writes
#   to disk constantly. Without log_type the default applies
#   (error/warning/notice/information). Uncomment for debugging.
# ---------------------------------------------------------------------
log_dest stdout
#log_type all
